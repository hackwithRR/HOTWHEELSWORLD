    function App() {
      // Global Shared State
      const [view, setView] = useState('storefront'); // 'storefront' | 'admin'
      const [storePage, setStorePage] = useState('home'); // home, shop, hunt, garage, product, cart, checkout, account, brands, categories
      const [adminTab, setAdminTab] = useState('overview'); // overview, products, inventory, add-product, orders, coupons, brands, analytics
      
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [brands, setBrands] = useState(INITIAL_BRANDS);
      const [coupons, setCoupons] = useState(INITIAL_COUPONS);
      const [orders, setOrders] = useState(INITIAL_ORDERS);
      
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [cart, setCart] = useState([]);
      const [appliedCoupon, setAppliedCoupon] = useState(null);
      const [garage, setGarage] = useState({ owned: ['P-103'], wishlist: ['P-101', 'P-102'], hunting: ['P-104'] });
      
      // Store Filters
      const [filterBrand, setFilterBrand] = useState('ALL');
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [filterPrice, setFilterPrice] = useState('ALL');

      // Feedback Toast
      const [toast, setToast] = useState(null);

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [view, storePage, adminTab, products, cart]);

      // Cart Calculations
      const cartSubtotal = useMemo(() => cart.reduce((sum, item) => sum + (item.price * item.qty), 0), [cart]);
      
      const cartDiscount = useMemo(() => {
        if (!appliedCoupon) return 0;
        if (appliedCoupon.type === 'PERCENTAGE') {
          return Math.min(Math.round((cartSubtotal * appliedCoupon.value) / 100), appliedCoupon.maxDiscount || 9999);
        }
        if (appliedCoupon.type === 'FIXED') {
          return Math.min(appliedCoupon.value, cartSubtotal);
        }
        return 0;
      }, [appliedCoupon, cartSubtotal]);

      const shippingFee = useMemo(() => {
        if (cartSubtotal > 1500 || (appliedCoupon && appliedCoupon.type === 'FREE_SHIPPING')) return 0;
        return cart.length > 0 ? 99 : 0;
      }, [cartSubtotal, appliedCoupon, cart]);

      const cartTotal = Math.max(0, cartSubtotal - cartDiscount + shippingFee);

      // Actions
      const addToCart = (product) => {
        if (product.stock <= 0) {
          showToast('Product is currently out of stock', 'error');
          return;
        }
        setCart(prev => {
          const existing = prev.find(p => p.id === product.id);
          if (existing) {
            return prev.map(p => p.id === product.id ? { ...p, qty: p.qty + 1 } : p);
          }
          return [...prev, { ...product, qty: 1 }];
        });
        showToast(`Added ${product.name} to Cart`);
      };

      const toggleGarageItem = (productId, category) => {
        setGarage(prev => {
          const current = prev[category] || [];
          const exists = current.includes(productId);
          const updated = exists ? current.filter(id => id !== productId) : [...current, productId];
          return { ...prev, [category]: updated };
        });
        showToast(`Updated Collection Garage`);
      };

      const applyCouponCode = (code) => {
        const found = coupons.find(c => c.code.toUpperCase() === code.trim().toUpperCase() && c.active);
        if (!found) {
          showToast('Invalid or expired coupon code', 'error');
          return;
        }
        if (cartSubtotal < found.minOrder) {
          showToast(`Minimum order value of ₹${found.minOrder} required`, 'error');
          return;
        }
        setAppliedCoupon(found);
        showToast(`Coupon '${found.code}' applied successfully!`);
      };

      const handlePublishProduct = (newProd) => {
        setProducts(prev => [newProd, ...prev]);
        showToast(`Published '${newProd.name}' to Storefront`);
        setAdminTab('products');
      };

      const handlePlaceOrder = (customerDetails) => {
        const newOrderId = `#CAST-${Math.floor(10000 + Math.random() * 90000)}`;
        const newOrder = {
          id: newOrderId,
          customer: customerDetails,
          items: cart.map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty })),
          subtotal: cartSubtotal,
          discount: cartDiscount,
          shipping: shippingFee,
          total: cartTotal,
          paymentMethod: customerDetails.paymentMethod || 'UPI',
          orderStatus: 'CONFIRMED',
          createdAt: new Date().toISOString().replace('T', ' ').substring(0, 16)
        };

        // Deduct inventory stock
        setProducts(prev => prev.map(p => {
          const cartItem = cart.find(ci => ci.id === p.id);
          if (cartItem) {
            return { ...p, stock: Math.max(0, p.stock - cartItem.qty) };
          }
          return p;
        }));

        setOrders(prev => [newOrder, ...prev]);
        setCart([]);
        setAppliedCoupon(null);
        showToast(`Order ${newOrderId} placed successfully!`);
        setStorePage('account');
      };

      const handleUpdateOrderStatus = (orderId, newStatus) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, orderStatus: newStatus } : o));
        showToast(`Order ${orderId} updated to ${newStatus}`);
      };

      return (
        <div className="flex-1 flex flex-col min-h-screen">
          {/* TOP GLOBAL MODE SWITCHER BANNER */}
          <div className="bg-brand-surface border-b border-brand-border px-4 py-2 flex justify-between items-center text-xs font-mono">
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span className="text-slate-400">PROTOTYPE MODE: INTEGRATED ECOMMERCE OS</span>
            </div>
            <div className="flex items-center gap-3">
              <button 
                onClick={() => setView('storefront')} 
                className={`px-3 py-1 rounded transition ${view === 'storefront' ? 'bg-brand-accent text-brand-black font-bold' : 'text-slate-400 hover:text-white'}`}>
                <i data-lucide="shopping-bag" className="w-3 h-3 inline mr-1"></i> STOREFRONT
              </button>
              <button 
                onClick={() => setView('admin')} 
                className={`px-3 py-1 rounded transition ${view === 'admin' ? 'bg-brand-accent text-brand-black font-bold' : 'text-slate-400 hover:text-white'}`}>
                <i data-lucide="layout-dashboard" className="w-3 h-3 inline mr-1"></i> SELLER ADMIN
              </button>
            </div>
          </div>

          {/* TOAST FEEDBACK NOTIFICATION */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 px-5 py-3 rounded border text-sm font-semibold shadow-2xl flex items-center gap-3 transition-all ${toast.type === 'error' ? 'bg-rose-950 border-rose-500 text-rose-200' : 'bg-brand-graphite border-brand-accent text-brand-cream'}`}>
              <i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check-circle-2'} className="w-5 h-5 text-brand-accent"></i>
              {toast.msg}
            </div>
          )}

          {/* VIEW SWITCHING RENDER */}
          {view === 'storefront' ? (
            <StorefrontView 
              storePage={storePage}
              setStorePage={setStorePage}
              products={products}
              brands={brands}
              categories={CATEGORIES}
              selectedProduct={selectedProduct}
              setSelectedProduct={setSelectedProduct}
              addToCart={addToCart}
              cart={cart}
              setCart={setCart}
              cartSubtotal={cartSubtotal}
              cartDiscount={cartDiscount}
              shippingFee={shippingFee}
              cartTotal={cartTotal}
              applyCouponCode={applyCouponCode}
              appliedCoupon={appliedCoupon}
              garage={garage}
              toggleGarageItem={toggleGarageItem}
              handlePlaceOrder={handlePlaceOrder}
              orders={orders}
              filterBrand={filterBrand}
              setFilterBrand={setFilterBrand}
              filterCategory={filterCategory}
              setFilterCategory={setFilterCategory}
              searchQuery={searchQuery}
              setSearchQuery={setSearchQuery}
            />
          ) : (
            <AdminView 
              adminTab={adminTab}
              setAdminTab={setAdminTab}
              products={products}
              setProducts={setProducts}
              brands={brands}
              coupons={coupons}
              setCoupons={setCoupons}
              orders={orders}
              handleUpdateOrderStatus={handleUpdateOrderStatus}
              handlePublishProduct={handlePublishProduct}
            />
          )}

          {/* FOOTER */}
          <footer className="mt-auto bg-brand-graphite border-t border-brand-border py-12 px-6 text-sm text-slate-400">
            <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
              <div>
                <h3 className="font-display text-xl font-bold tracking-wider text-white mb-3">HW WORLD</h3>
                <p className="text-xs text-slate-400 leading-relaxed">The World of Diecast. Precision models, rare collector drops, and premium miniature automotive art.</p>
              </div>
              <div>
                <h4 className="font-mono text-xs uppercase tracking-widest text-slate-200 mb-3">NAVIGATION</h4>
                <ul className="space-y-2 text-xs">
                  <li><button onClick={() => { setView('storefront'); setStorePage('shop'); }} className="hover:text-brand-accent">Catalog</button></li>
                  <li><button onClick={() => { setView('storefront'); setStorePage('brands'); }} className="hover:text-brand-accent">Brand Directory</button></li>
                  <li><button onClick={() => { setView('storefront'); setStorePage('hunt'); }} className="hover:text-brand-accent">The Hunt</button></li>
                  <li><button onClick={() => { setView('storefront'); setStorePage('garage'); }} className="hover:text-brand-accent">My Garage</button></li>
                </ul>
              </div>
              <div>
                <h4 className="font-mono text-xs uppercase tracking-widest text-slate-200 mb-3">BRANDS</h4>
                <div className="flex flex-wrap gap-2 text-xs">
                  {brands.slice(0,6).map(b => (
                    <span key={b.id} className="bg-brand-surface border border-brand-border px-2 py-1 rounded text-slate-300">{b.name}</span>
                  ))}
                </div>
              </div>
              <div>
                <h4 className="font-mono text-xs uppercase tracking-widest text-slate-200 mb-3">OPERATING SYSTEM</h4>
                <p className="text-xs text-slate-400 mb-3">Manage inventory, orders, and customer garages with the live seller admin engine.</p>
                <button onClick={() => setView('admin')} className="w-full bg-brand-surface border border-brand-accent text-brand-accent hover:bg-brand-accent hover:text-brand-black px-3 py-2 rounded text-xs font-bold transition">
                  OPEN SELLER DASHBOARD
                </button>
              </div>
            </div>
            <div className="max-w-7xl mx-auto border-t border-brand-border/50 pt-6 flex flex-col md:flex-row justify-between items-center text-xs text-slate-500">
              <p>© 2026 HW WORLD. DIECAST AUTOMOTIVE RETAIL INC. ALL RIGHTS RESERVED.</p>
              <p className="font-mono mt-2 md:mt-0">CURATED FOR COLLECTORS WORLDWIDE</p>
            </div>
          </footer>
        </div>
      );
    }

    // ==========================================
    // 01. STOREFRONT EXPERIENCE COMPONENTS
    // ==========================================

    function StorefrontView({

                    <td className="p-3">
                      <span className={`px-2 py-0.5 rounded ${p.stock <= 0 ? 'bg-rose-950 text-rose-300' : p.stock <= p.lowStockThreshold ? 'bg-amber-950 text-amber-300' : 'bg-emerald-950 text-emerald-300'}`}>
                        {p.stock}
                      </span>
                    </td>
                    <td className="p-3 text-slate-500">{p.sku}</td>
                    <td className="p-3">
                      <button 
                        onClick={() => setProducts(products.filter(item => item.id !== p.id))}
                        className="text-rose-400 hover:underline"
                      >
                        DELETE
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function AdminAddProduct({ brands, handlePublishProduct }) {
      const [form, setForm] = useState({
        name: 'Porsche 911 Singer Reimagined',
        brand: 'MINI GT',
        category: 'GERMAN',
        series: 'Collector Edition',
        description: 'Exquisite 1:64 precision miniature with metallic paint finish and rubber tires.',
        price: 1699,
        mrp: 1999,
        scale: '1:64',
        year: 2026,
        condition: 'New',
        packaging: 'Boxed',
        stock: 12,
        lowStockThreshold: 3,
        sku: 'MGT-POR-SING-01',
        images: ['https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=800&q=80']
      });

      const onSubmit = (e) => {
        e.preventDefault();
        const newProduct = {
          ...form,
          id: `P-${Math.floor(100 + Math.random() * 900)}`,
          slug: form.name.toLowerCase().replace(/\s+/g, '-'),
          tags: ['New Arrival'],
          featured: true,
          rare: false,
          limited: true
        };
        handlePublishProduct(newProduct);
      };

      return (
        <div className="max-w-3xl space-y-6">
          <h1 className="font-display text-2xl font-bold text-white border-b border-brand-border pb-4">PUBLISH NEW DIECAST MODEL</h1>

          <form onSubmit={onSubmit} className="bg-brand-surface border border-brand-border rounded p-6 space-y-4 font-mono text-xs">
            <div>
              <label className="text-slate-400 block mb-1">MODEL NAME</label>
              <input type="text" required value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className="w-full bg-brand-black border border-brand-border p-2 rounded text-white focus:outline-none focus:border-brand-accent" />
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="text-slate-400 block mb-1">BRAND</label>
                <select value={form.brand} onChange={e => setForm({ ...form, brand: e.target.value })} className="w-full bg-brand-black border border-brand-border p-2 rounded text-white focus:outline-none focus:border-brand-accent">
                  {brands.map(b => <option key={b.id} value={b.name}>{b.name}</option>)}
                </select>
              </div>

              <div>
                <label className="text-slate-400 block mb-1">CATEGORY</label>
                <input type="text" required value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} className="w-full bg-brand-black border border-brand-border p-2 rounded text-white focus:outline-none focus:border-brand-accent" />
              </div>
            </div>

            <div className="grid grid-cols-3 gap-4">
              <div>
                <label className="text-slate-400 block mb-1">PRICE (₹)</label>
                <input type="number" required value={form.price} onChange={e => setForm({ ...form, price: Number(e.target.value) })} className="w-full bg-brand-black border border-brand-border p-2 rounded text-white focus:outline-none focus:border-brand-accent" />
              </div>

              <div>
                <label className="text-slate-400 block mb-1">MRP (₹)</label>
                <input type="number" required value={form.mrp} onChange={e => setForm({ ...form, mrp: Number(e.target.value) })} className="w-full bg-brand-black border border-brand-border p-2 rounded text-white focus:outline-none focus:border-brand-accent" />
              </div>

              <div>
                <label className="text-slate-400 block mb-1">INITIAL STOCK</label>
                <input type="number" required value={form.stock} onChange={e => setForm({ ...form, stock: Number(e.target.value) })} className="w-full bg-brand-black border border-brand-border p-2 rounded text-white focus:outline-none focus:border-brand-accent" />
              </div>
            </div>

            <div>
              <label className="text-slate-400 block mb-1">DESCRIPTION</label>
              <textarea rows="3" value={form.description} onChange={e => setForm({ ...form, description: e.target.value })} className="w-full bg-brand-black border border-brand-border p-2 rounded text-white focus:outline-none focus:border-brand-accent"></textarea>
            </div>

            <button type="submit" className="w-full bg-brand-accent text-brand-black font-bold py-3 rounded uppercase tracking-widest hover:bg-yellow-400 transition">
              PUBLISH TO STOREFRONT
            </button>
          </form>
        </div>
      );
    }

    function AdminInventory({ products, setProducts }) {
      const updateStock = (id, newQty) => {
        setProducts(products.map(p => p.id === id ? { ...p, stock: Math.max(0, newQty) } : p));
      };

      return (
        <div className="space-y-6">
          <h1 className="font-display text-2xl font-bold text-white border-b border-brand-border pb-4">INVENTORY STOCK CONTROL</h1>

          <div className="bg-brand-surface border border-brand-border rounded overflow-x-auto">
            <table className="w-full text-left font-mono text-xs">
              <thead className="bg-brand-black border-b border-brand-border text-slate-400">
                <tr>
                  <th className="p-3">PRODUCT</th>
                  <th className="p-3">SKU</th>
                  <th className="p-3">CURRENT STOCK</th>
                  <th className="p-3">STATUS</th>
                  <th className="p-3">STOCK ADJUSTMENT</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-brand-border/60 text-slate-300">
                {products.map(p => (
                  <tr key={p.id}>
                    <td className="p-3 font-bold text-white">{p.name}</td>
                    <td className="p-3 text-slate-500">{p.sku}</td>
                    <td className="p-3 font-bold">{p.stock}</td>
                    <td className="p-3">
                      <span className={`px-2 py-0.5 rounded text-[10px] ${p.stock > 4 ? 'bg-emerald-950 text-emerald-300' : p.stock > 0 ? 'bg-amber-950 text-amber-300' : 'bg-rose-950 text-rose-300'}`}>
                        {p.stock > 4 ? 'IN STOCK' : p.stock > 0 ? 'LOW STOCK' : 'OUT OF STOCK'}
                      </span>
                    </td>
                    <td className="p-3 flex items-center gap-2">
                      <button onClick={() => updateStock(p.id, p.stock - 1)} className="px-2 py-1 bg-brand-black border border-brand-border rounded hover:border-brand-accent text-white">-</button>
                      <button onClick={() => updateStock(p.id, p.stock + 1)} className="px-2 py-1 bg-brand-black border border-brand-border rounded hover:border-brand-accent text-white">+</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function AdminOrders({ orders, handleUpdateOrderStatus }) {
      return (
        <div className="space-y-6">
          <h1 className="font-display text-2xl font-bold text-white border-b border-brand-border pb-4">LIVE ORDER MANAGEMENT</h1>

          <div className="space-y-4">
            {orders.map(order => (
              <div key={order.id} className="bg-brand-surface border border-brand-border rounded p-6 font-mono text-xs">
                <div className="flex justify-between items-center border-b border-brand-border pb-3 mb-4">
                  <div>
                    <span className="text-brand-accent font-bold text-sm">{order.id}</span>
                    <span className="text-slate-400 block">{order.customer.name} ({order.customer.phone})</span>
                  </div>
                  
                  <div className="flex items-center gap-2">
                    <span className="text-slate-400">STATUS:</span>
                    <select 
                      value={order.orderStatus} 
                      onChange={(e) => handleUpdateOrderStatus(order.id, e.target.value)}
                      className="bg-brand-black border border-brand-accent text-brand-accent font-bold px-2 py-1 rounded focus:outline-none"
                    >
                      <option value="CONFIRMED">CONFIRMED</option>
                      <option value="PACKING">PACKING</option>
                      <option value="SHIPPED">SHIPPED</option>
                      <option value="DELIVERED">DELIVERED</option>
                      <option value="CANCELLED">CANCELLED</option>
                    </select>
                  </div>
                </div>

                <div className="space-y-1 mb-4 text-slate-300">
                  {order.items.map((item, i) => (
                    <div key={i} className="flex justify-between">
                      <span>{item.qty}x {item.name}</span>
                      <span>₹{item.price * item.qty}</span>
                    </div>
                  ))}
                </div>

                <div className="border-t border-brand-border/60 pt-2 flex justify-between font-bold text-white">
                  <span>TOTAL REVENUE</span>
                  <span className="text-brand-accent">₹{order.total}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function AdminCoupons({ coupons, setCoupons }) {
      const [newCode, setNewCode] = useState('');
      const [newValue, setNewValue] = useState(15);

      const addCoupon = (e) => {
        e.preventDefault();
        if (!newCode) return;
        setCoupons([...coupons, { code: newCode.toUpperCase(), type: 'PERCENTAGE', value: Number(newValue), minOrder: 500, maxDiscount: 500, active: true, usageCount: 0 }]);
        setNewCode('');
      };

      return (
        <div className="space-y-6">
          <h1 className="font-display text-2xl font-bold text-white border-b border-brand-border pb-4">PROMO & COUPON MANAGEMENT</h1>

          <form onSubmit={addCoupon} className="bg-brand-surface border border-brand-border p-4 rounded flex gap-4 items-end font-mono text-xs">
            <div className="flex-1">
              <label className="text-slate-400 block mb-1">NEW COUPON CODE</label>
              <input type="text" placeholder="e.g. RACE15" value={newCode} onChange={e => setNewCode(e.target.value)} className="w-full bg-brand-black border border-brand-border p-2 rounded text-white uppercase" />
            </div>
            <div className="w-32">
              <label className="text-slate-400 block mb-1">DISCOUNT %</label>
              <input type="number" value={newValue} onChange={e => setNewValue(e.target.value)} className="w-full bg-brand-black border border-brand-border p-2 rounded text-white" />
            </div>
            <button type="submit" className="bg-brand-accent text-brand-black font-bold px-4 py-2.5 rounded">CREATE COUPON</button>
          </form>

          <div className="bg-brand-surface border border-brand-border rounded overflow-x-auto font-mono text-xs">
            <table className="w-full text-left">
              <thead className="bg-brand-black border-b border-brand-border text-slate-400">
                <tr>
                  <th className="p-3">CODE</th>
                  <th className="p-3">TYPE</th>
                  <th className="p-3">VALUE</th>
                  <th className="p-3">USES</th>
                  <th className="p-3">STATUS</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-brand-border text-slate-300">
                {coupons.map((c, i) => (
                  <tr key={i}>
                    <td className="p-3 font-bold text-brand-accent">{c.code}</td>
                    <td className="p-3">{c.type}</td>
                    <td className="p-3">{c.type === 'PERCENTAGE' ? `${c.value}%` : `₹${c.value}`}</td>
                    <td className="p-3">{c.usageCount}</td>
                    <td className="p-3"><span className="bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded">ACTIVE</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function AdminAnalytics({ orders, products }) {
      return (
        <div className="space-y-6 font-mono">
          <h1 className="font-display text-2xl font-bold text-white border-b border-brand-border pb-4">ANALYTICS & METRICS</h1>
          
          <div className="bg-brand-surface border border-brand-border rounded p-6">
            <h3 className="text-xs font-bold text-white uppercase tracking-widest mb-4">BUSINESS PERFORMANCE SUMMARY</h3>
            <p className="text-xs text-slate-400 leading-relaxed">
              Store operating at optimal performance. Total recorded completed transactions: {orders.length}. Total active diecast inventory listings: {products.length}.
            </p>
          </div>
        </div>
      );
    }

    // RENDER APP
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
